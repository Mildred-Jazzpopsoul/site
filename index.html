<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Officiel</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8A2BE2">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Effet Néon Gros Titre */
    .neon-title {
      font-size: 4rem;
      text-transform: uppercase;
      color: #fff;
      text-align: center;
      text-shadow: 
        0 0 7px #fff,
        0 0 10px #fff,
        0 0 21px #fff,
        0 0 42px #8A2BE2,
        0 0 82px #8A2BE2,
        0 0 92px #8A2BE2,
        0 0 102px #8A2BE2,
        0 0 151px #8A2BE2;
      margin-bottom: 10px;
    }

    /* Container réactif pour vidéos et iFrames */
    .responsive-iframe-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      max-width: 100%;
      background: #000;
      border-radius: 8px;
      margin: 20px 0;
    }

    .responsive-iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Styles du Carrousel Photos */
    .carousel-container {
      position: relative;
      max-width: 800px;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 8px;
    }

    .carousel-slide {
      display: none;
      text-align: center;
    }

    .carousel-slide.active {
      display: block;
    }

    .carousel-slide img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 8px;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      font-size: 2rem;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 4px;
    }

    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    .external-link-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background: #8A2BE2;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background 0.3s;
    }

    .external-link-btn:hover {
      background: #9d3bf0;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- En-tête avec navigation -->
  <header>
    <nav class="container">
      <div class="logo-container">
        <img id="nav-logo" src="" alt="Logo" style="display: none; height: 40px;">
        <span id="nav-title" class="logo"></span>
      </div>
      <ul>
        <li><a href="#hero">Accueil</a></li>
        <li><a href="#about">À Propos</a></li>
        <li><a href="#media">Musique & Vidéos</a></li>
        <li><a href="#agenda">Agenda</a></li>
        <li><a href="#gallery">Galerie</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Section Accueil / Hero Néon avec Logo -->
  <section id="hero" class="hero">
    <div class="container" style="text-align: center;">
      <img id="hero-logo" src="" alt="Logo Groupe" style="display: none; max-width: 250px; margin: 0 auto 20px auto;">
      <h1 class="neon-title"></h1>
      <p class="subtitle" style="text-align:center; font-size: 1.5rem;"></p>
    </div>
  </section>

  <!-- Section À Propos -->
  <section id="about" class="section">
    <div class="container">
      <h2></h2>
      <p class="bio-text"></p>
    </div>
  </section>

  <!-- Section Musique & Vidéos Google Drive -->
  <section id="media" class="section">
    <div class="container">
      <h2 class="media-title">Musique & Vidéos</h2>
      <div class="media-list"></div>
    </div>
  </section>

  <!-- Section Agenda (Google Calendar) -->
  <section id="agenda" class="section">
    <div class="container">
      <h2 class="agenda-title">Agenda & Concerts</h2>
      <div class="responsive-iframe-container">
        <iframe id="calendar-iframe" src="https://calendar.google.com/calendar/embed?src=mildredwhatelse%40gmail.com&ctz=Europe%2FParis" style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>
      </div>
    </div>
  </section>

  <!-- Section Galerie Photos Carrousel -->
  <section id="gallery" class="section">
    <div class="container" style="text-align: center;">
      <h2 class="gallery-title">Galerie Photos</h2>
      
      <div class="carousel-container">
        <div id="carousel-slides"></div>
        <button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094;</button>
        <button class="carousel-btn next" onclick="moveSlide(1)">&#10095;</button>
      </div>

      <div id="external-folder-container"></div>
    </div>
  </section>

  <!-- Section Contact -->
  <section id="contact" class="section">
    <div class="container">
      <h2>Contact</h2>
      <p class="contact-email"></p>
    </div>
  </section>

  <footer>
    <div class="container footer-content">
      <p><a href="admin/">Administration</a></p>
    </div>
  </footer>

  <!-- Gestion du Carrousel & Connexion CMS -->
  <script>
    let currentSlide = 0;

    function showSlide(index) {
      const slides = document.querySelectorAll('.carousel-slide');
      if (slides.length === 0) return;
      if (index >= slides.length) currentSlide = 0;
      else if (index < 0) currentSlide = slides.length - 1;
      else currentSlide = index;

      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === currentSlide);
      });
    }

    function moveSlide(step) {
      showSlide(currentSlide + step);
    }

    async function loadSiteContent() {
      try {
        const response = await fetch('content.json?v=' + new Date().getTime());
        if (!response.ok) return;
        const data = await response.json();

        // 1. Masquage/Affichage dynamique des rubriques
        const activeSections = data.active_sections || [];
        const sectionsMap = {
          'hero': '#hero',
          'about': '#about',
          'media': '#media',
          'agenda': '#agenda',
          'gallery': '#gallery',
          'contact': '#contact'
        };

        if (Array.isArray(activeSections) && activeSections.length > 0) {
          Object.keys(sectionsMap).forEach(key => {
            const el = document.querySelector(sectionsMap[key]);
            if (el) {
              el.style.display = activeSections.includes(key) ? 'block' : 'none';
            }
          });
        }

        // 2. Section Hero (Logo, Titre néon & sous-titre)
        if (data.hero) {
          const titleEl = document.querySelector('.neon-title');
          const navTitleEl = document.getElementById('nav-title');
          const subEl = document.querySelector('.hero .subtitle');
          const navLogoEl = document.getElementById('nav-logo');
          const heroLogoEl = document.getElementById('hero-logo');

          if (titleEl && data.hero.title) titleEl.textContent = data.hero.title;
          if (navTitleEl && data.hero.title) navTitleEl.textContent = data.hero.title;
          if (subEl && data.hero.subtitle) subEl.textContent = data.hero.subtitle;

          if (data.hero.logo) {
            if (navLogoEl) {
              navLogoEl.src = data.hero.logo;
              navLogoEl.style.display = 'inline-block';
            }
            if (heroLogoEl) {
              heroLogoEl.src = data.hero.logo;
              heroLogoEl.style.display = 'block';
            }
          }
        }

        // 3. Section À Propos
        if (data.about) {
          const titleEl = document.querySelector('#about h2');
          const bioEl = document.querySelector('#about .bio-text');
          if (titleEl && data.about.title) titleEl.textContent = data.about.title;
          if (bioEl && data.about.bio) bioEl.textContent = data.about.bio;
        }

        // 4. Section Vidéos Google Drive multiples
        if (data.media_section) {
          const titleEl = document.querySelector('.media-title');
          if (titleEl && data.media_section.title) titleEl.textContent = data.media_section.title;

          if (Array.isArray(data.media_section.tracks)) {
            const container = document.querySelector('#media .media-list');
            if (container) {
              container.innerHTML = '';
              data.media_section.tracks.forEach(track => {
                if (track.embed_url) {
                  const videoBox = document.createElement('div');
                  videoBox.className = 'responsive-iframe-container';
                  videoBox.innerHTML = `<iframe src="${track.embed_url}" allow="autoplay" allowfullscreen></iframe>`;
                  container.appendChild(videoBox);
                }
              });
            }
          }
        }

        // 5. Google Calendar paramétrable
        if (data.agenda_section) {
          const titleEl = document.querySelector('.agenda-title');
          const iframeEl = document.getElementById('calendar-iframe');
          if (titleEl && data.agenda_section.title) titleEl.textContent = data.agenda_section.title;
          if (iframeEl && data.agenda_section.calendar_url) {
            iframeEl.src = data.agenda_section.calendar_url;
          }
        }

        // 6. Carrousel Galerie Photos & Répertoire Externe
        if (data.gallery_section) {
          const titleEl = document.querySelector('.gallery-title');
          if (titleEl && data.gallery_section.title) titleEl.textContent = data.gallery_section.title;

          const slidesContainer = document.getElementById('carousel-slides');
          if (slidesContainer && Array.isArray(data.gallery_section.photos)) {
            slidesContainer.innerHTML = '';
            data.gallery_section.photos.forEach((photo, index) => {
              if (photo.image) {
                const slide = document.createElement('div');
                slide.className = `carousel-slide ${index === 0 ? 'active' : ''}`;
                slide.innerHTML = `<img src="${photo.image}" alt="Photo"><p>${photo.caption || ''}</p>`;
                slidesContainer.appendChild(slide);
              }
            });
          }

          const folderContainer = document.getElementById('external-folder-container');
          if (folderContainer && data.gallery_section.external_folder_url) {
            folderContainer.innerHTML = `<a href="${data.gallery_section.external_folder_url}" target="_blank" class="external-link-btn">📁 Voir le répertoire photos complet</a>`;
          }
        }

        // 7. Contact
        if (data.contact_section && data.contact_section.email) {
          const emailEl = document.querySelector('#contact .contact-email');
          if (emailEl) emailEl.innerHTML = `<a href="mailto:${data.contact_section.email}">${data.contact_section.email}</a>`;
        }

      } catch (e) {
        console.log('Chargement des données dynamique.');
      }
    }

    document.addEventListener('DOMContentLoaded', loadSiteContent);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
