<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nom du Groupe</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8A2BE2">
  <meta name="description" content="Site officiel du groupe.">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Intégration réactive pour les vidéos et le calendrier */
    .responsive-iframe-container {
      position: relative;
      padding-bottom: 56.25%; /* Ratio 16:9 pour vidéos et agendas */
      height: 0;
      overflow: hidden;
      max-width: 100%;
      background: #000;
      border-radius: 8px;
      margin: 20px 0;
    }

    .responsive-iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <nav class="container">
      <div class="logo">GROUPE</div>
      <ul>
        <li><a href="#hero">Accueil</a></li>
        <li><a href="#about">À Propos</a></li>
        <li><a href="#media">Musique & Vidéos</a></li>
        <li><a href="#agenda">Agenda</a></li>
        <li><a href="#gallery">Galerie</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Section Accueil / Hero -->
  <section id="hero" class="hero">
    <div class="container">
      <h1></h1>
      <p></p>
    </div>
  </section>

  <!-- Section À Propos -->
  <section id="about" class="section">
    <div class="container">
      <h2></h2>
      <p class="bio-text"></p>
    </div>
  </section>

  <!-- Section Musique & Vidéos -->
  <section id="media" class="section">
    <div class="container">
      <h2>Musique & Vidéos</h2>
      <div class="media-list"></div>
    </div>
  </section>

  <!-- Section Agenda (Google Calendar) -->
  <section id="agenda" class="section">
    <div class="container">
      <h2>Agenda & Concerts</h2>
      <div class="responsive-iframe-container">
        <iframe src="https://calendar.google.com/calendar/embed?src=mildredwhatelse%40gmail.com&ctz=Europe%2FParis" style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>
      </div>
    </div>
  </section>

  <!-- Section Galerie Photos -->
  <section id="gallery" class="section">
    <div class="container">
      <h2>Galerie Photos</h2>
      <div class="gallery-grid"></div>
    </div>
  </section>

  <!-- Section Contact -->
  <section id="contact" class="section">
    <div class="container">
      <h2>Contact</h2>
      <p class="contact-email"></p>
      <div class="social-links"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container footer-content">
      <p>&copy; Tous droits réservés.</p>
      <p><a href="admin/">Administration</a></p>
    </div>
  </footer>

  <!-- Script d'intégration dynamique Sveltia / Decap CMS -->
  <script>
    async function loadSiteContent() {
      try {
        const response = await fetch('content.json?v=' + new Date().getTime());
        if (!response.ok) return;
        const data = await response.json();

        // 1. Masquage/Affichage dynamique des rubriques
        const activeSections = data.active_sections || [];
        const sectionsMap = {
          'hero': '#hero',
          'about': '#about',
          'media': '#media',
          'agenda': '#agenda',
          'gallery': '#gallery',
          'contact': '#contact'
        };

        if (Array.isArray(activeSections) && activeSections.length > 0) {
          Object.keys(sectionsMap).forEach(key => {
            const el = document.querySelector(sectionsMap[key]);
            if (el) {
              el.style.display = activeSections.includes(key) ? 'block' : 'none';
            }
          });
        }

        // 2. Mettre à jour la section Accueil
        if (data.hero) {
          const titleEl = document.querySelector('#hero h1');
          const subEl = document.querySelector('#hero p');
          if (titleEl && data.hero.title) titleEl.textContent = data.hero.title;
          if (subEl && data.hero.subtitle) subEl.textContent = data.hero.subtitle;
        }

        // 3. Mettre à jour la section À Propos
        if (data.about) {
          const titleEl = document.querySelector('#about h2');
          const bioEl = document.querySelector('#about .bio-text');
          if (titleEl && data.about.title) titleEl.textContent = data.about.title;
          if (bioEl && data.about.bio) bioEl.textContent = data.about.bio;
        }

        // 4. Mettre à jour les Médias / Vidéos (Drive / YouTube)
        if (data.media_section && Array.isArray(data.media_section.tracks)) {
          const container = document.querySelector('#media .media-list');
          if (container) {
            container.innerHTML = '';
            data.media_section.tracks.forEach(track => {
              if (track.embed_url) {
                const videoBox = document.createElement('div');
                videoBox.className = 'responsive-iframe-container';
                videoBox.innerHTML = `<iframe src="${track.embed_url}" allow="autoplay" allowfullscreen></iframe>`;
                container.appendChild(videoBox);
              }
            });
          }
        }

        // 5. Mettre à jour la Galerie Photos
        if (data.gallery_section && Array.isArray(data.gallery_section.photos)) {
          const galleryContainer = document.querySelector('#gallery .gallery-grid');
          if (galleryContainer) {
            galleryContainer.innerHTML = '';
            data.gallery_section.photos.forEach(photo => {
              if (photo.image) {
                const imgEl = document.createElement('img');
                imgEl.src = photo.image;
                imgEl.alt = photo.caption || 'Photo';
                galleryContainer.appendChild(imgEl);
              }
            });
          }
        }

        // 6. Mettre à jour la section Contact
        if (data.contact_section) {
          const emailEl = document.querySelector('#contact .contact-email');
          if (emailEl && data.contact_section.email) {
            emailEl.innerHTML = `<a href="mailto:${data.contact_section.email}">${data.contact_section.email}</a>`;
          }
        }

      } catch (e) {
        console.log('Attente de données via le fichier content.json');
      }
    }

    document.addEventListener('DOMContentLoaded', loadSiteContent);

    // Enregistrement du Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
