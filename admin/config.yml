backend:
  name: github
  repo: Mildred-Jazzpopsoul/site # <-- Remplacez par votre pseudo/nom-du-repo GitHub
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "site_content"
    label: "Gestion Globale du Site"
    files:
      - file: "content.json"
        label: "Configuration & Rubriques"
        name: "content"
        fields:

          # --- VISIBILITÉ DES RUBRIQUES ---
          - name: "active_sections"
            label: "Rubriques à afficher sur le site"
            widget: "select"
            multiple: true
            required: false
            options:
              - { label: "Accueil / Hero", value: "hero" }
              - { label: "À Propos", value: "about" }
              - { label: "Musique & Vidéos", value: "media" }
              - { label: "Agenda (Google Calendar)", value: "agenda" }
              - { label: "Galerie Photos (Carrousel)", value: "gallery" }
              - { label: "Contact", value: "contact" }

          # --- ACCUEIL ---
          - name: "hero"
            label: "Rubrique Accueil"
            widget: "object"
            required: false
            fields:
              - { label: "Logo du Groupe", name: "logo", widget: "image", required: false }
              - { label: "Titre Néon du Groupe", name: "title", widget: "string", required: false }
              - { label: "Sous-titre / Slogan", name: "subtitle", widget: "string", required: false }

          # --- À PROPOS ---
          - name: "about"
            label: "Rubrique À Propos"
            widget: "object"
            required: false
            fields:
              - { label: "Titre de section", name: "title", widget: "string", required: false }
              - { label: "Texte de présentation", name: "bio", widget: "text", required: false }

          # --- MUSIQUE & VIDÉOS ---
          - name: "media_section"
            label: "Rubrique Vidéos Google Drive & Médias"
            widget: "object"
            required: false
            fields:
              - { label: "Titre de section", name: "title", widget: "string", required: false }
              - name: "tracks"
                label: "Liste des vidéos Google Drive"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titre de la vidéo", name: "title", widget: "string", required: false }
                  - { label: "Lien d'intégration Google Drive (/preview)", name: "embed_url", widget: "string", required: false }

          # --- AGENDA ---
          - name: "agenda_section"
            label: "Rubrique Agenda Google Calendar"
            widget: "object"
            required: false
            fields:
              - { label: "Titre de la section", name: "title", widget: "string", required: false }
              - { label: "URL d'intégration Google Calendar", name: "calendar_url", widget: "string", required: false }

          # --- GALERIE PHOTOS ---
          - name: "gallery_section"
            label: "Galerie Photos (Carrousel)"
            widget: "object"
            required: false
            fields:
              - { label: "Titre de la galerie", name: "title", widget: "string", required: false }
              - { label: "Lien vers un répertoire photo externe", name: "external_folder_url", widget: "string", required: false }
              - name: "photos"
                label: "Photos du carrousel"
                widget: "list"
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Légende", name: "caption", widget: "string", required: false }

          # --- CONTACT ---
          - name: "contact_section"
            label: "Contact & Réseaux"
            widget: "object"
            required: false
            fields:
              - { label: "Email de contact", name: "email", widget: "string", required: false }
