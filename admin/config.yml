backend:
  name: github
  repo: Mildred-Jazzpopsoul/site
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "site_content"
    label: "Gestion Globale du Site"
    files:
      - file: "content.json"
        label: "Rubriques & Contenus"
        name: "content"
        fields:
          # ACCUEIL
          - name: "hero"
            label: " Rubrique Accueil"
            widget: "object"
            fields:
              - { label: "Titre principal", name: "title", widget: "string", default: "Nom du Groupe" }
              - { label: "Sous-titre", name: "subtitle", widget: "string", default: "Neon Rock / Synth" }
              - { label: "Image de fond", name: "bg_image", widget: "image", required: false }

          # À PROPOS
          - name: "about"
            label: " Rubrique À Propos"
            widget: "object"
            fields:
              - { label: "Titre de section", name: "title", widget: "string", default: "À Propos" }
              - { label: "Texte biographie", name: "bio", widget: "text" }
              - { label: "Photo d'illustration", name: "photo", widget: "image", required: false }

          # MÉDIAS / MUSIQUE
          - name: "media_section"
            label: " Rubrique Musique & Vidéos"
            widget: "object"
            fields:
              - { label: "Titre de section", name: "title", widget: "string", default: "Musique & Vidéos" }
              - name: "tracks"
                label: "Liste des morceaux / vidéos (Glisser-déposer pour réordonner)"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Type", name: "type", widget: "select", options: ["audio", "video", "embed_youtube"] }
                  - { label: "Fichier (mp3/mp4)", name: "file", widget: "file", required: false }
                  - { label: "Lien YouTube/Spotify", name: "url", widget: "string", required: false }

          # GALERIE PHOTOS
          - name: "gallery_section"
            label: " Galerie Photos"
            widget: "object"
            fields:
              - { label: "Titre de la galerie", name: "title", widget: "string", default: "Galerie Photos" }
              - name: "photos"
                label: "Photos (Ajouter/Supprimer/Réordonner)"
                widget: "list"
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Légende", name: "caption", widget: "string", required: false }

          # CONTACT
          - name: "contact_section"
            label: " Contact & Liens"
            widget: "object"
            fields:
              - { label: "Titre section contact", name: "title", widget: "string", default: "Contact" }
              - { label: "Email de contact", name: "email", widget: "string", required: false }
              - { label: "Lien Facebook", name: "facebook_url", widget: "string", required: false }
              - { label: "Lien Instagram", name: "instagram_url", widget: "string", required: false }
