backend:
  name: github
  repo: Mildred-Jazzpopsoul/site  # <-- Remplacer par votre pseudo/nom-du-repo GitHub
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "site_content"
    label: "Gestion Globale du Site"
    files:
      - file: "content.json"
        label: "Configuration & Rubriques"
        name: "content"
        fields:

          # --- GESTION DE LA VISIBILITÉ DES RUBRIQUES ---
          - name: "active_sections"
            label: "Rubriques à afficher sur le site (décocher pour masquer)"
            widget: "select"
            multiple: true
            required: false
            options:
              - { label: "Accueil / Hero", value: "hero" }
              - { label: "À Propos", value: "about" }
              - { label: "Musique & Vidéos", value: "media" }
              - { label: "Galerie Photos", value: "gallery" }
              - { label: "Contact", value: "contact" }

          # --- ACCUEIL ---
          - name: "hero"
            label: "Rubrique Accueil"
            widget: "object"
            required: false
            fields:
              - { label: "Titre principal", name: "title", widget: "string", required: false }
              - { label: "Sous-titre", name: "subtitle", widget: "string", required: false }
              - { label: "Image de fond", name: "bg_image", widget: "image", required: false }

          # --- À PROPOS ---
          - name: "about"
            label: "Rubrique À Propos"
            widget: "object"
            required: false
            fields:
              - { label: "Titre de section", name: "title", widget: "string", required: false }
              - { label: "Texte de présentation", name: "bio", widget: "text", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }

          # --- MUSIQUE & VIDÉOS ---
          - name: "media_section"
            label: "Rubrique Musique & Vidéos"
            widget: "object"
            required: false
            fields:
              - { label: "Titre de section", name: "title", widget: "string", required: false }
              - name: "tracks"
                label: "Liste des médias"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titre du morceau / vidéo", name: "title", widget: "string", required: false }
                  - { label: "Fichier audio / vidéo léger", name: "file", widget: "file", required: false }
                  - { label: "Lien d'intégration (URL Google Drive preview, YouTube, Vimeo...)", name: "embed_url", widget: "string", required: false }

          # --- GALERIE PHOTOS ---
          - name: "gallery_section"
            label: "Galerie Photos"
            widget: "object"
            required: false
            fields:
              - { label: "Titre de la galerie", name: "title", widget: "string", required: false }
              - name: "photos"
                label: "Photos"
                widget: "list"
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Photo", name: "image", widget: "image", required: false }
                  - { label: "Légende", name: "caption", widget: "string", required: false }

          # --- CONTACT ---
          - name: "contact_section"
            label: "Contact & Réseaux"
            widget: "object"
            required: false
            fields:
              - { label: "Titre de section", name: "title", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Lien Facebook", name: "facebook_url", widget: "string", required: false }
              - { label: "Lien Instagram", name: "instagram_url", widget: "string", required: false }
