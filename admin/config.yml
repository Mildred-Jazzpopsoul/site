backend:
  name: github
  repo: Mildred-Jazzpopsoul/site
  branch: main

media_folder: "media"
public_folder: "media"

collections:
  - name: "pages"
    label: "Contenu des Sections"
    files:
      - file: "index.html"
        label: "Page d'accueil"
        name: "index"
        fields:
          - {label: "Nom du Groupe", name: "title", widget: "string"}
          - {label: "Annonce Principale", name: "subtitle", widget: "string"}
